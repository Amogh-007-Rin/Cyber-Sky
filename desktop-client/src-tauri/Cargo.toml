[package]
name = "cyber-sky-desktop"
version = "0.1.0"
description = "Cyber Sky desktop client"
authors = ["Cyber Sky"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
default-run = "cyber-sky-desktop"

[lib]
name = "cyber_sky_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
